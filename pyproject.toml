[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelican-copy-code"
version = "0.2.0"
description = "Adds a copy-to-clipboard button to code blocks in Pelican sites"
authors = [{ name = "Fidel Ramos", email = "contact.gyldd@8shield.net" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["pelican", "plugin"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pelican :: Plugins",
    "Framework :: Pelican",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["pelican>=4.9", "beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://github.com/haplo/pelican-copy-code"
Repository = "https://github.com/haplo/pelican-copy-code"
Issues = "https://github.com/haplo/pelican-copy-code/issues"
Changelog = "https://github.com/haplo/pelican-copy-code/blob/main/CHANGELOG.md"

[project.entry-points."pelican.plugins"]
copy_code = "pelican.plugins.copy_code"

[tool.hatch.build.targets.wheel]
packages = ["pelican"]

[dependency-groups]
dev = ["babel"]
